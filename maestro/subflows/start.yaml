# Fresh install state, then open the app from the dev server through the dev client link.
# Needs APP_ID, DEV_CLIENT_LINK and SERVER_URL (the runner sets all three).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    stopApp: true
    permissions:
      notifications: unset
- openLink: ${DEV_CLIENT_LINK}
# The dev client may show its one-time intro on a fresh install.
- tapOn:
    text: Continue
    optional: true
# Older dev builds may have already opened their menu before processing the launch options.
- runFlow:
    when:
      visible: '(?i).*developer menu.*'
    commands:
      - pressKey: back
# The launcher sometimes ignores the link and shows its server list: open the link again.
- runFlow:
    when:
      visible: '(?i)development servers'
    commands:
      - openLink: ${DEV_CLIENT_LINK}
- tapOn:
    text: ${SERVER_URL}
    optional: true
# Wait for app content or the intro that overlays it, after the bundle loads.
- extendedWaitUntil:
    visible: '(?s)(Skip|.*This is the developer menu.*|Open React Native dev menu)'
    timeout: 180000
- tapOn:
    text: Continue
    optional: true
- runFlow:
    when:
      visible: 'Open React Native dev menu'
    commands:
      - scrollUntilVisible:
          element:
            text: Tools button
          direction: DOWN
      - tapOn: Tools button
      - back
- extendedWaitUntil:
    visible:
      id: onboarding-next
    timeout: 180000
