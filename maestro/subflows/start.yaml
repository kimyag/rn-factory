# Fresh install state, then open the app from the dev server through the dev client link.
# Needs APP_ID, DEV_CLIENT_LINK and SERVER_URL (the runner sets all three).
appId: ${APP_ID}
---
- launchApp:
    clearState: true
    stopApp: true
- openLink: ${DEV_CLIENT_LINK}
# The dev client may show its one-time intro on a fresh install.
- tapOn:
    text: Continue
    optional: true
# Older dev builds may have already opened their menu before processing the launch options.
- runFlow:
    when:
      visible: '(?i).*developer menu.*'
    commands:
      - pressKey: back
# The launcher sometimes ignores the link and shows its server list: open the link again.
- runFlow:
    when:
      visible: '(?i)development servers'
    commands:
      - openLink: ${DEV_CLIENT_LINK}
- tapOn:
    text: ${SERVER_URL}
    optional: true
# The first bundle can take a while.
- extendedWaitUntil:
    visible:
      id: onboarding-next
    timeout: 180000
