# Skip the pages, decline analytics, and land on the feature screen.
appId: ${APP_ID}
---
- tapOn:
    id: onboarding-skip
- extendedWaitUntil:
    visible:
      id: analytics-decline
    timeout: 15000
- tapOn:
    id: analytics-decline
- extendedWaitUntil:
    visible:
      id: feature-home
    timeout: 15000
