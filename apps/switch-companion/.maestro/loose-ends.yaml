appId: ${APP_ID}
---
- runFlow: subflows/perf-dev-start.yaml
- runFlow: subflows/finish-onboarding.yaml
- openLink: switch-companion:///perf-seed
- extendedWaitUntil:
    visible:
      id: loose-ends-list
    timeout: 15000
- scrollUntilVisible:
    element:
      id: loose-ends-row-perf-loose-end-500
    direction: DOWN
- swipe:
    from:
      id: loose-ends-row-perf-loose-end-500
    direction: RIGHT
    duration: 500
- assertVisible:
    id: loose-ends-complete-mark
- assertNotVisible:
    id: loose-ends-row-perf-loose-end-500
